name: Deploy to Pages

# Publishes on every push to main, so the live site tracks the repo without a
# manual step. Kept dispatchable too, for redeploying to pick up fresher
# busrouter.sg route data without needing a code change.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway: a half-published site is worse than a slightly
# stale one. Queued runs supersede each other instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Now that publishing is automatic, these gate it: a push that breaks the
      # ranking logic must not reach the live site.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
